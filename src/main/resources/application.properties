# Application Configuration
spring.application.name=CineQ API


# Disable PostgreSQL/JPA autoconfiguration (we only use MongoDB)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api

#Mongo DB Configuration
# Connection pooling for free tier: 5 max connections
# URI Format: mongodb://host:port/database?maxPoolSize=5&minPoolSize=1&maxIdleTimeMS=30000&waitQueueTimeoutMS=10000
spring.main.lazy-initialization=false
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cineqdb?maxPoolSize=7&minPoolSize=1&maxIdleTimeMS=30000&waitQueueTimeoutMS=10000}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}

# Additional MongoDB connection pool optimization
# Connection pool settings for localhost development
spring.data.mongodb.socket-keep-alive=true
spring.data.mongodb.socket-timeout-ms=10000
spring.data.mongodb.connection-timeout-ms=10000

# Database Configuration
# Use environment variables or application-local.properties for sensitive data
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cineqdb}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:password}
# spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# # JPA/Hibernate Configuration
# spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
# spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# # H2 Console (for development only)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Spring Multipart configuration
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:3MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:20MB}

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Validation Configuration
spring.web.resources.add-mappings=false

# Logging Configuration - Controlled via APP_LOG_LEVEL environment variable
# Default: ERROR (production-safe)
# Options: ERROR, WARN, INFO, DEBUG, TRACE
# For local development, set: APP_LOG_LEVEL=DEBUG
# For production, set: APP_LOG_LEVEL=INFO (not DEBUG — DEBUG floods logs with Spring internals)

# NOTE: When logback-spring.xml is present, it takes precedence over these.
# These serve as fallback if logback-spring.xml is removed.
logging.level.root=${APP_LOG_LEVEL:INFO}
logging.level.com.awal.cineq=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.boot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${APP_LOG_LEVEL:ERROR}
logging.level.org.springframework.boot.autoconfigure=${APP_LOG_LEVEL:ERROR}
logging.level.org.hibernate.tool.schema=${APP_LOG_LEVEL:ERROR}
logging.level.org.springframework.data.jpa=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.transaction=${APP_LOG_LEVEL:INFO}
# Keep Spring internal framework logging at WARN regardless of APP_LOG_LEVEL
# These produce massive output at DEBUG and slow the app down
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.context.annotation=WARN
logging.level.org.springframework.core=WARN
logging.level.org.mongodb.driver=WARN

# Enable console logging explicitly
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# File logging configuration with rotation
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


# Force console output alongside file logging
spring.main.banner-mode=console

# ==========================================
# Performance Optimizations for Production
# ==========================================
# Disable JMX (not needed in containers, saves ~1s startup)
spring.jmx.enabled=false

# OpenAPI: disable in production if not needed (saves ~2s startup)
# Set ENABLE_SWAGGER=false in production env to disable
springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}

# File storage configuration
app.file.upload-dir=uploads/images
app.file.storage.type=${FILE_STORAGE_TYPE:local}
# 2MB in bytes
app.file.max-size=${FILE_STORAGE_MAX_SIZE:22797152}
app.file.allowed-types=image/png,image/jpeg,image/jpg,image/gif

#Supabase Configuration
supbase.api.key=${SUPABASE_API_KEY}
supabase.storage.url =${SUPABASE_API_URL}   

# Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
# 15 minutes
# app.jwt.expiration=900000
# 1 hour  
# app.jwt.expiration=3600000
# 24 hours 
# app.jwt.expiration=86400000

# Basic Authentication (remove after JWT implementation)
# spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
# spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:pwd}
# spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:role}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Cookie Configuration (HttpOnly authentication cookies)
app.security.cookie.name=auth_token
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.http-only=true
app.security.cookie.same-site=Strict
app.security.cookie.max-age=${COOKIE_MAX_AGE:86400}
app.security.cookie.path=/

# Rate Limiting Configuration
app.security.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.ratelimit.login.capacity=5
app.security.ratelimit.login.refill-minutes=15
app.security.ratelimit.register.capacity=3
app.security.ratelimit.register.refill-minutes=60
app.security.ratelimit.password-reset.capacity=3
app.security.ratelimit.password-reset.refill-minutes=60
app.security.ratelimit.email-verification.capacity=10
app.security.ratelimit.email-verification.refill-minutes=60

#ExceptionHandler
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never


app.security.prominent-role=${PROMINENT_ROLE}
app.security.authorization-provider=${AUTH_PROVIDER:RBAC}  # Options: RBAC, ABAC, PBAC

# ==========================================
# Customer Authentication Settings
# ==========================================
# Email verification: if true, customers must verify email before login
app.customer.email-verification-required=${CUSTOMER_EMAIL_VERIFICATION:false}

# Login attempt throttling
app.customer.max-failed-login-attempts=${CUSTOMER_MAX_FAILED_ATTEMPTS:10}
app.customer.lockout-duration-minutes=${CUSTOMER_LOCKOUT_MINUTES:60}

# Password reset token expiry (hours)
app.customer.password-reset-token-expiry-hours=${CUSTOMER_RESET_TOKEN_EXPIRY:24}

# Admin notification emails (comma-separated for multiple admins)
# Example: admin1@example.com,admin2@example.com,manager@example.com
app.customer.admin-notification-emails=${ADMIN_NOTIFICATION_EMAILS:}

# Application URLs (for email links)
app.customer.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.customer.admin-url=${APP_ADMIN_URL:http://localhost:3000}

# Backend API URL
app.app.url=${APP_API_URL:http://localhost:8080}

# ==========================================
# Email Configuration
# ==========================================
app.email.smtp-host=${APP_EMAIL_SMTP_HOST:smtp.gmail.com}
app.email.smtp-port=${APP_EMAIL_SMTP_PORT:587}
app.email.smtp-username=${APP_EMAIL_SMTP_USERNAME}
app.email.smtp-password=${APP_EMAIL_SMTP_PASSWORD}
app.email.from-address=${APP_EMAIL_FROM_ADDRESS}
app.email.from-name=${APP_EMAIL_FROM_NAME:CineQ}
app.email.enable-tls=${APP_EMAIL_ENABLE_TLS:true}
app.email.enable-ssl=${APP_EMAIL_ENABLE_SSL:false}


app.app.google-client-id=${GOOGLE_CLIENT_ID}


# ==========================================
# Payment Gateways
# ==========================================
app.payment.esewa.merchant-code=${PAYMENT_ESEWA_MERCHANT_CODE:EPAYTEST}
app.payment.esewa.secret-key=${PAYMENT_ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
app.payment.esewa.payment-url=${PAYMENT_ESEWA_PAYMENT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
app.payment.khalti.secret-key=${PAYMENT_KHALTI_SECRET_KEY:test_secret_key_placeholder}
app.payment.khalti.initiate-url=${PAYMENT_KHALTI_INITIATE_URL:https://a.khalti.com/api/v2/epayment/initiate/}
app.payment.success-url=${PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
app.payment.failure-url=${PAYMENT_FAILURE_URL:http://localhost:3000/payment/failure}
app.payment.website-url=${PAYMENT_WEBSITE_URL:http://localhost:3000}

# Token Configuration
app.token.expiry-hours=${TOKEN_EXPIRY_HOURS:24}
app.token.max-resend-per-hour=${TOKEN_MAX_RESEND_PER_HOUR:3}
app.security.ratelimit.resend-link.capacity=${TOKEN_MAX_RESEND_PER_HOUR:3}
app.security.ratelimit.resend-link.refill-minutes=60
