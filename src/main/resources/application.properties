# # H2 Console (for development only)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Spring Multipart configuration
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:3MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:20MB}

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Validation Configuration
spring.web.resources.add-mappings=false

# Logging Configuration - Controlled via APP_LOG_LEVEL environment variable
# Default: ERROR (production-safe)
# Options: ERROR, WARN, INFO, DEBUG, TRACE
# For local development, set: APP_LOG_LEVEL=DEBUG
# For production, set: APP_LOG_LEVEL=ERROR
APP_LOG_LEVEL=${APP_LOG_LEVEL:ERROR}

logging.level.root=${APP_LOG_LEVEL}
logging.level.com.awal.cineq=${APP_LOG_LEVEL}
logging.level.org.springframework.web=${APP_LOG_LEVEL}
logging.level.org.springframework.boot=${APP_LOG_LEVEL}
logging.level.org.springframework.security=${APP_LOG_LEVEL}
logging.level.org.hibernate.SQL=${APP_LOG_LEVEL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${APP_LOG_LEVEL}
logging.level.org.springframework.boot.autoconfigure=${APP_LOG_LEVEL}
logging.level.org.hibernate.tool.schema=${APP_LOG_LEVEL}
logging.level.org.springframework.data.jpa=${APP_LOG_LEVEL}
logging.level.org.springframework.transaction=${APP_LOG_LEVEL}

# Enable console logging explicitly
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# File logging configuration  
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Force console output alongside file logging
spring.main.banner-mode=console

# File storage configuration
app.file.upload-dir=uploads/images
app.file.storage.type=${FILE_STORAGE_TYPE:local}
# 2MB in bytes
app.file.max-size=${FILE_STORAGE_MAX_SIZE:22797152}
app.file.allowed-types=image/png,image/jpeg,image/jpg,image/gif

#Supabase Configuration
supbase.api.key=${SUPABASE_API_KEY}
supabase.storage.url =${SUPABASE_API_URL}   

# Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
# 15 minutes
# app.jwt.expiration=900000
# 1 hour  
# app.jwt.expiration=3600000
# 24 hours 
# app.jwt.expiration=86400000

# Basic Authentication (remove after JWT implementation)
# spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
# spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:pwd}
# spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:role}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

#ExceptionHandler
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never


app.security.prominent-role=${PROMINENT_ROLE}
app.security.authorization-provider=${AUTH_PROVIDER:RBAC}  # Options: RBAC, ABAC, PBAC

# ==========================================
# Customer Authentication Settings
# ==========================================
# Email verification: if true, customers must verify email before login
app.customer.email-verification-required=${CUSTOMER_EMAIL_VERIFICATION:false}

# Login attempt throttling
app.customer.max-failed-login-attempts=${CUSTOMER_MAX_FAILED_ATTEMPTS:10}
app.customer.lockout-duration-minutes=${CUSTOMER_LOCKOUT_MINUTES:60}

# Password reset token expiry (hours)
app.customer.password-reset-token-expiry-hours=${CUSTOMER_RESET_TOKEN_EXPIRY:24}

# Admin notification emails (comma-separated for multiple admins)
# Example: admin1@example.com,admin2@example.com,manager@example.com
app.customer.admin-notification-emails=${ADMIN_NOTIFICATION_EMAILS:}

# Application URLs (for email links)
app.customer.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.customer.admin-url=${APP_ADMIN_URL:http://localhost:3000}

# Backend API URL
app.app.url=${APP_API_URL:http://localhost:8080}

# ==========================================
# Email Configuration
# ==========================================
app.email.smtp-host=${APP_EMAIL_SMTP_HOST:smtp.gmail.com}
app.email.smtp-port=${APP_EMAIL_SMTP_PORT:587}
app.email.smtp-username=${APP_EMAIL_SMTP_USERNAME}
app.email.smtp-password=${APP_EMAIL_SMTP_PASSWORD}
app.email.from-address=${APP_EMAIL_FROM_ADDRESS}
app.email.from-name=${APP_EMAIL_FROM_NAME:CineQ}
app.email.enable-tls=${APP_EMAIL_ENABLE_TLS:true}
app.email.enable-ssl=${APP_EMAIL_ENABLE_SSL:false}

